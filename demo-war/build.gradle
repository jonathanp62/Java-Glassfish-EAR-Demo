plugins {
    id 'war'
}

configurations {
    warArchive {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    // Compile against the EJB project, but don't bundle it inside the WAR's WEB-INF/lib
    compileOnly project(':demo-ejb')

    compileOnly libs.jakarta.servlet.jsp.jstl.api

    runtimeOnly libs.glassfish.jakarta.servlet.jsp.jstl

    testImplementation project(':demo-ejb')
}

artifacts {
    warArchive tasks.named('war')
}

tasks.named('jar') {
    enabled = false
}

war {
    def appVersion = project.version

    filesMatching('WEB-INF/web.xml') {
        expand(appVersion: appVersion)
    }
}
